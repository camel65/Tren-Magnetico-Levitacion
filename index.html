<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Maglev Express - Edición Insuperable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #010308;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        #btn-inicio {
            padding: 20px 55px;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 30, 45, 0.85);
            border: 2px solid #00f0ff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.5);
            z-index: 40;
            letter-spacing: 2px;
        }

        #btn-inicio:hover {
            background-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.95);
            transform: scale(1.06);
        }

        /* Botones superiores compactos */
        .controles-sup {
            display: none;
            position: fixed;
            top: 10px;
            right: 12px;
            gap: 5px;
            z-index: 50;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: calc(100vw - 360px);
        }

        .btn-sup {
            padding: 6px 9px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #e2f8ff;
            background: rgba(2, 12, 24, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 18px;
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: all 0.18s ease;
            line-height: 1.15;
            white-space: nowrap;
        }

        .btn-sup:hover {
            background: #00f0ff;
            color: #000000;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.75);
        }

        .btn-sup.activo-modo {
            background: rgba(57, 255, 20, 0.22);
            border-color: #39ff14;
            color: #39ff14;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.35);
        }

        .btn-sup.modo-expreso {
            background: rgba(255, 0, 127, 0.24);
            border-color: #ff007f;
            color: #ff66b2;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.35);
        }

        .btn-sup.modo-cabina {
            background: rgba(255, 230, 0, 0.22);
            border-color: #ffe600;
            color: #ffe600;
            box-shadow: 0 0 12px rgba(255, 230, 0, 0.35);
        }

        .grupo-zoom {
            display: inline-flex;
            align-items: center;
            background: rgba(2, 12, 24, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 18px;
            overflow: hidden;
        }

        .grupo-zoom button {
            background: transparent;
            border: none;
            color: #e2f8ff;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .grupo-zoom button:hover {
            background: rgba(0, 240, 255, 0.25);
            color: #00f0ff;
        }

        #btn-salir:hover {
            background: #ff0055;
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.65);
        }

        /* Pedales inferiores */
        .controles-maglev {
            display: none;
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom, 16px));
            left: 50%;
            transform: translateX(-50%);
            gap: 14px;
            z-index: 35;
            align-items: center;
            width: max-content;
            max-width: 96vw;
            transition: left 0.2s ease, right 0.2s ease, transform 0.2s ease;
        }

        .controles-maglev.en-cabina {
            left: auto;
            right: 16px;
            transform: none;
        }

        .btn-pedal {
            width: 132px;
            height: 72px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: transform 0.08s ease, box-shadow 0.1s ease, background 0.1s ease;
        }

        .btn-claxon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #00f0ff;
            background: rgba(2, 18, 34, 0.9);
            color: #00f0ff;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
            transition: transform 0.08s ease, background 0.1s ease;
        }

        .btn-claxon:active {
            transform: scale(0.9);
            background: #00f0ff;
            color: #000;
        }

        #btn-freno {
            border: 2px solid #ff0055;
            background: linear-gradient(180deg, rgba(255, 0, 85, 0.28), rgba(40, 10, 20, 0.92));
            color: #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.35);
        }

        #btn-freno:active, #btn-freno.activo {
            transform: scale(0.94);
            background: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.95);
        }

        #btn-acelerar {
            border: 2px solid #39ff14;
            background: linear-gradient(180deg, rgba(57, 255, 20, 0.28), rgba(10, 40, 15, 0.92));
            color: #39ff14;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.35);
        }

        #btn-acelerar:active, #btn-acelerar.activo {
            transform: scale(0.94);
            background: #39ff14;
            color: #000000;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.95);
        }

        /* Ajustes específicos para pantallas móviles */
        @media (max-width: 820px) {
            .controles-sup {
                max-width: calc(100vw - 12px);
                left: 6px;
                right: 6px;
                top: 6px;
                justify-content: center;
                gap: 4px;
            }

            .btn-sup {
                padding: 5px 7px;
                font-size: 0.65rem;
            }

            .grupo-zoom button {
                padding: 5px 6px;
                font-size: 0.65rem;
            }

            .controles-maglev {
                gap: 8px;
                bottom: max(12px, env(safe-area-inset-bottom, 12px));
            }

            .controles-maglev.en-cabina {
                right: 8px;
                gap: 6px;
            }

            .btn-pedal {
                width: 112px;
                height: 62px;
                font-size: 0.82rem;
            }

            .controles-maglev.en-cabina .btn-pedal {
                width: 82px;
                height: 56px;
                font-size: 0.72rem;
            }

            .btn-pedal small {
                display: none;
            }

            .btn-claxon {
                width: 48px;
                height: 48px;
                font-size: 1rem;
            }

            .controles-maglev.en-cabina .btn-claxon {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }
        }

        #canvas-container {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>

    <button id="btn-inicio">INICIO</button>

    <div class="controles-sup" id="panel-sup">
        <button class="btn-sup" id="btn-vista">🎥 Vista: EXTERIOR</button>
        <div class="grupo-zoom" id="grupo-zoom">
            <button id="btn-zoom-out" title="Alejar cámara [-]">🔍−</button>
            <button id="btn-zoom-reset" title="Zoom automático">AUTO</button>
            <button id="btn-zoom-in" title="Acercar cámara [+]">🔍+</button>
        </div>
        <button class="btn-sup" id="btn-ruta">🗺️ L1 CENTRO</button>
        <button class="btn-sup" id="btn-piloto">🤖 Piloto: OFF</button>
        <button class="btn-sup" id="btn-servicio">🚄 LOCAL</button>
        <button class="btn-sup" id="btn-clima">🌦️ AUTO</button>
        <button class="btn-sup" id="btn-audio">🔊 ON</button>
        <button class="btn-sup" id="btn-reiniciar">↻ Línea</button>
        <button class="btn-sup" id="btn-salir">✖</button>
    </div>

    <div class="controles-maglev" id="controles-maglev">
        <button class="btn-pedal" id="btn-freno">
            <span>🛑 FRENAR</span>
            <small>[ESPACIO / ↓]</small>
        </button>
        <button class="btn-claxon" id="btn-claxon" title="Claxon Maglev [H]">📯</button>
        <button class="btn-pedal" id="btn-acelerar">
            <span>⚡ ACELERAR</span>
            <small>[W / →]</small>
        </button>
    </div>

    <div id="canvas-container">
        <canvas id="maglevCanvas"></canvas>
    </div>

    <script>
        // =====================================================================
        // REFERENCIAS DOM Y ESTADO GLOBAL
        // =====================================================================
        const btnInicio = document.getElementById('btn-inicio');
        const panelSup = document.getElementById('panel-sup');
        const controlesMaglev = document.getElementById('controles-maglev');
        const btnAcelerar = document.getElementById('btn-acelerar');
        const btnFreno = document.getElementById('btn-freno');
        const btnClaxon = document.getElementById('btn-claxon');
        const btnVista = document.getElementById('btn-vista');
        const grupoZoom = document.getElementById('grupo-zoom');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomReset = document.getElementById('btn-zoom-reset');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnRuta = document.getElementById('btn-ruta');
        const btnPiloto = document.getElementById('btn-piloto');
        const btnServicio = document.getElementById('btn-servicio');
        const btnClima = document.getElementById('btn-clima');
        const btnAudio = document.getElementById('btn-audio');
        const btnReiniciar = document.getElementById('btn-reiniciar');
        const btnSalir = document.getElementById('btn-salir');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('maglevCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let animacionId = null;
        let activo = false;
        let ultimoFrame = 0;

        let pilotoAutomatico = false;
        let modoExpreso = false;
        let audioActivo = true;
        let vistaCabina = false;
        let zoomManual = null;

        // Rutas seleccionables con identidad y estaciones propias
        const RUTAS = [
            {
                id: 0,
                etiqueta: 'L1 CENTRO',
                factorVel: 1.0,
                color: '#00f0ff',
                estaciones: ['MADRID', 'GUADALAJARA', 'ZARAGOZA', 'LLEIDA', 'TARRAGONA', 'BARCELONA SANTS']
            },
            {
                id: 1,
                etiqueta: 'L2 COSTERA',
                factorVel: 1.08,
                color: '#39ff14',
                estaciones: ['BARCELONA', 'TARRAGONA', 'PEÑÍSCOLA', 'CASTELLÓN', 'VALENCIA', 'ALICANTE']
            },
            {
                id: 2,
                etiqueta: 'L3 ORBITAL',
                factorVel: 1.16,
                color: '#ff007f',
                estaciones: ['LEÓN', 'SALAMANCA', 'ÁVILA', 'TOLEDO', 'SEVILLA', 'MÁLAGA']
            }
        ];
        let indiceRuta = 0;

        // Paletas de cielo para transiciones suaves entre climas/ciclos solares
        const PALETAS_CIELO = {
            AMANECER:  { top: [11, 16, 38],   mid: [45, 27, 78],   low: [157, 56, 102], hor: [255, 158, 68],  solAlpha: 1,   nieblaAlpha: 0 },
            SOLEADO:   { top: [12, 74, 140],  mid: [29, 117, 194], low: [92, 179, 235],  hor: [188, 227, 250], solAlpha: 1,   nieblaAlpha: 0 },
            ATARDECER: { top: [18, 8, 38],    mid: [74, 18, 72],   low: [194, 54, 72],   hor: [255, 107, 43],  solAlpha: 1,   nieblaAlpha: 0 },
            DESPEJADO: { top: [1, 3, 10],     mid: [4, 13, 31],    low: [11, 25, 54],    hor: [24, 13, 44],    solAlpha: 0,   nieblaAlpha: 0 },
            LLUVIA:    { top: [2, 6, 16],     mid: [7, 18, 36],    low: [14, 30, 56],    hor: [22, 24, 48],    solAlpha: 0,   nieblaAlpha: 0.12 },
            TORMENTA:  { top: [1, 3, 9],      mid: [5, 11, 24],    low: [12, 18, 38],    hor: [24, 14, 38],    solAlpha: 0,   nieblaAlpha: 0.18 },
            NIEBLA:    { top: [5, 14, 28],    mid: [12, 30, 54],   low: [24, 52, 82],    hor: [42, 74, 104],   solAlpha: 0.2, nieblaAlpha: 0.65 }
        };

        // Sistema de clima y transición gradual
        const CLIMAS = ['AMANECER', 'SOLEADO', 'ATARDECER', 'DESPEJADO', 'LLUVIA', 'TORMENTA', 'NIEBLA'];
        let climaAuto = true;
        let indiceClima = 0;
        let climaActual = CLIMAS[indiceClima];
        let temporizadorClima = 0;
        let intensidadRelampago = 0;
        let rayoActual = null;
        let mezclaTunel = 0; // 0 = exterior, 1 = dentro de túnel

        let cieloSuavizado = {
            top: [...PALETAS_CIELO.AMANECER.top],
            mid: [...PALETAS_CIELO.AMANECER.mid],
            low: [...PALETAS_CIELO.AMANECER.low],
            hor: [...PALETAS_CIELO.AMANECER.hor],
            solAlpha: PALETAS_CIELO.AMANECER.solAlpha,
            nieblaAlpha: PALETAS_CIELO.AMANECER.nieblaAlpha
        };

        // Sistema de puntuación, control térmico y rangos de conductor
        let puntuacion = 0;
        let rachaParadas = 0;
        let rangoActual = 'CADETE';
        let bloqueoTermico = false;
        let ultimaValoracion = null;
        let mensajeMegafonia = 'BIENVENIDO A NEON MAGLEV EXPRESS';

        let estadoRuta = 'EN_MARCHA';
        let mensajeRuta = '';
        let tiempoFinRuta = 0;
        let numeroLinea = 1;
        let estacionesVisitadas = 0;
        let totalParadasRuta = 6;
        let direccionSentido = 1;

        let estacionActualAvisada = null;
        let tiempoAvisoInicio = 0;
        let mostrarAvisoEstacion = false;

        const LONGITUD_VIA = 36000;
        const LONGITUD_TREN = 520;
        const LIMITE_SEGURIDAD_IZQ = 2200;
        const LIMITE_SEGURIDAD_DER = 33000;

        let tren = {
            x: 3200,
            velocidad: 0,
            acelerando: false,
            frenando: false,
            temperaturaMagnetica: 30,
            pasajeros: 140,
            inclinacion: 0
        };

        let estaciones = [];
        let tuneles = [];
        let edificiosFondo = [];
        let estrellasFondo = [];
        let particulasPlasma = [];
        let chispasFreno = [];
        let postesVia = [];
        let lineasVelocidad = [];
        let gotasLluvia = [];
        let trenesParalelos = [];
        let traficoAereo = [];

        // =====================================================================
        // MOTOR DE AUDIO SINTÉTICO SUAVE (WEB AUDIO API)
        // =====================================================================
        let audioCtx = null;
        let motorOsc = null;
        let motorSubOsc = null;
        let motorFiltro = null;
        let motorGain = null;

        function inicializarAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();

                    motorOsc = audioCtx.createOscillator();
                    motorSubOsc = audioCtx.createOscillator();
                    motorFiltro = audioCtx.createBiquadFilter();
                    motorGain = audioCtx.createGain();

                    motorOsc.type = 'sine';
                    motorSubOsc.type = 'sine';
                    motorOsc.frequency.value = 45;
                    motorSubOsc.frequency.value = 90;

                    motorFiltro.type = 'lowpass';
                    motorFiltro.frequency.value = 240;
                    motorFiltro.Q.value = 0.7;

                    motorGain.gain.value = 0;

                    motorOsc.connect(motorFiltro);
                    motorSubOsc.connect(motorFiltro);
                    motorFiltro.connect(motorGain);
                    motorGain.connect(audioCtx.destination);

                    motorOsc.start();
                    motorSubOsc.start();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (_) {}
        }

        function actualizarSonidoMotor(velocidad, frenando) {
            if (!audioCtx || !motorGain || !motorFiltro) return;
            if (!audioActivo || !activo || velocidad < 2) {
                motorGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.12);
                return;
            }
            const velMaxRef = modoExpreso ? 920 : 750;
            const ratio = Math.min(1, velocidad / velMaxRef);
            const freqBase = 42 + ratio * (modoExpreso ? 88 : 72);
            const freqArmonico = frenando ? freqBase * 1.25 : freqBase * 1.5;
            const corteFiltro = 160 + ratio * 240;
            const volumen = Math.min(0.048, 0.012 + ratio * 0.032);

            motorOsc.frequency.setTargetAtTime(freqBase, audioCtx.currentTime, 0.1);
            motorSubOsc.frequency.setTargetAtTime(freqArmonico, audioCtx.currentTime, 0.1);
            motorFiltro.frequency.setTargetAtTime(corteFiltro, audioCtx.currentTime, 0.12);
            motorGain.gain.setTargetAtTime(volumen, audioCtx.currentTime, 0.12);
        }

        function tocarClaxonMaglev() {
            inicializarAudio();
            if (!audioActivo || !audioCtx) return;
            const ahora = audioCtx.currentTime;
            const freqs = [277.18, 349.23];
            freqs.forEach((f) => {
                const osc = audioCtx.createOscillator();
                const filtro = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, ahora);
                filtro.type = 'lowpass';
                filtro.frequency.setValueAtTime(950, ahora);

                gain.gain.setValueAtTime(0.001, ahora);
                gain.gain.linearRampToValueAtTime(0.045, ahora + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0008, ahora + 0.45);

                osc.connect(filtro);
                filtro.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(ahora);
                osc.stop(ahora + 0.48);
            });
        }

        function tocarTonoParadaPerfecta() {
            if (!audioActivo || !audioCtx) return;
            const ahora = audioCtx.currentTime;
            const notas = [523.25, 659.25, 783.99];
            notas.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const filtro = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ahora + idx * 0.09);
                filtro.type = 'lowpass';
                filtro.frequency.setValueAtTime(1100, ahora + idx * 0.09);

                const tInicio = ahora + idx * 0.09;
                gain.gain.setValueAtTime(0.0001, tInicio);
                gain.gain.linearRampToValueAtTime(0.032, tInicio + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0008, tInicio + 0.32);

                osc.connect(filtro);
                filtro.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(tInicio);
                osc.stop(tInicio + 0.34);
            });
        }

        function tocarTonoAvisoEstacion() {
            if (!audioActivo || !audioCtx) return;
            const ahora = audioCtx.currentTime;
            const notas = [392.0, 493.88];
            notas.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const filtro = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ahora + idx * 0.16);
                filtro.type = 'lowpass';
                filtro.frequency.setValueAtTime(900, ahora + idx * 0.16);

                const tInicio = ahora + idx * 0.16;
                gain.gain.setValueAtTime(0.0001, tInicio);
                gain.gain.linearRampToValueAtTime(0.035, tInicio + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0008, tInicio + 0.34);

                osc.connect(filtro);
                filtro.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(tInicio);
                osc.stop(tInicio + 0.36);
            });
        }

        function tocarDingDongPuertas() {
            if (!audioActivo || !audioCtx) return;
            const ahora = audioCtx.currentTime;
            const notas = [329.63, 261.63];
            notas.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const filtro = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ahora + idx * 0.28);
                filtro.type = 'lowpass';
                filtro.frequency.setValueAtTime(750, ahora + idx * 0.28);

                const tInicio = ahora + idx * 0.28;
                gain.gain.setValueAtTime(0.0001, tInicio);
                gain.gain.linearRampToValueAtTime(0.045, tInicio + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0008, tInicio + 0.65);

                osc.connect(filtro);
                filtro.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(tInicio);
                osc.stop(tInicio + 0.68);
            });
        }

        // =====================================================================
        // TRANSICIONES SUAVES, RANGO Y UTILIDADES
        // =====================================================================
        function interpolarValor(actual, objetivo, factor) {
            return actual + (objetivo - actual) * factor;
        }

        function interpolarRgb(arrActual, arrObjetivo, factor) {
            return [
                interpolarValor(arrActual[0], arrObjetivo[0], factor),
                interpolarValor(arrActual[1], arrObjetivo[1], factor),
                interpolarValor(arrActual[2], arrObjetivo[2], factor)
            ];
        }

        function rgbCss(arr, alpha = 1) {
            const r = Math.round(arr[0]);
            const g = Math.round(arr[1]);
            const b = Math.round(arr[2]);
            return alpha < 1 ? `rgba(${r}, ${g}, ${b}, ${alpha})` : `rgb(${r}, ${g}, ${b})`;
        }

        function actualizarTransicionesAmbiente(dt, tunelActivo) {
            const factorCielo = Math.min(1, dt * 1.15);
            const paletaObj = PALETAS_CIELO[climaActual] || PALETAS_CIELO.DESPEJADO;

            cieloSuavizado.top = interpolarRgb(cieloSuavizado.top, paletaObj.top, factorCielo);
            cieloSuavizado.mid = interpolarRgb(cieloSuavizado.mid, paletaObj.mid, factorCielo);
            cieloSuavizado.low = interpolarRgb(cieloSuavizado.low, paletaObj.low, factorCielo);
            cieloSuavizado.hor = interpolarRgb(cieloSuavizado.hor, paletaObj.hor, factorCielo);
            cieloSuavizado.solAlpha = interpolarValor(cieloSuavizado.solAlpha, paletaObj.solAlpha, factorCielo);
            cieloSuavizado.nieblaAlpha = interpolarValor(cieloSuavizado.nieblaAlpha, paletaObj.nieblaAlpha, factorCielo);

            const objetivoTunel = tunelActivo ? 1 : 0;
            mezclaTunel = interpolarValor(mezclaTunel, objetivoTunel, Math.min(1, dt * 5.5));
        }

            if (pts >= 1500) return 'PILOTO SUPREMO';

            return 'CADETE';
        }

            for (let t of tuneles) {

            return null;
        }
